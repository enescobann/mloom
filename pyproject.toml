[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mloom"
version = "0.1.0"
description = "Local-First LLMOps Orchestration Platform"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "openai>=1.0",
    "click>=8.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.45",
    "pandas>=2.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.6",
    "psycopg2-binary>=2.9",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[project.scripts]
mloom = "mloom.cli:cli"

[tool.setuptools.packages.find]
include = ["mloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
